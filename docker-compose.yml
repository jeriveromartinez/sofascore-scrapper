version: "3.8"

services:
  scraper:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-sofascore}
      API_ADDR: ${API_ADDR:-:8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
