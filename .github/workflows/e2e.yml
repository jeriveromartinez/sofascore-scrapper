name: E2E

on:
  push:
    branches:
      - main
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test images
        run: docker compose -f deployments/docker/compose.test.yml build

      - name: Start test stack
        run: docker compose -f deployments/docker/compose.test.yml up --wait

      - name: Ensure server is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/live; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server not ready"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install test dependencies
        working-directory: web
        run: npm ci

      - name: Run Playwright tests
        working-directory: web
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: docker compose -f deployments/docker/compose.test.yml down --volumes
