name: Load Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

jobs:
  smoke:
    name: Load test (smoke)
    if: github.event.inputs.suite == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3

      - name: Build test images
        run: docker compose -f deployments/docker/compose.test.yml build

      - name: Start test stack
        run: docker compose -f deployments/docker/compose.test.yml up --wait

      - name: Ensure server is healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/live; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server not ready"
          exit 1

      - name: Extract bootstrap invitation
        id: invite
        run: |
          token=$(docker compose -f deployments/docker/compose.test.yml exec -T backend cat /shared/invite.txt)
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Install k6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates gnupg
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq k6

      - name: Run load test
        run: k6 run --summary-export=k6-pr-load-summary.json tests/load/pr-load.js
        env:
          BASE_URL: http://localhost:8080
          INVITE_TOKEN: ${{ steps.invite.outputs.token }}

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-pr-load-summary
          path: k6-pr-load-summary.json
          retention-days: 7

      - name: Stop test stack
        if: always()
        run: docker compose -f deployments/docker/compose.test.yml down --volumes

  full:
    name: Full (30 min)
    if: github.event.inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install k6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates gnupg
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq k6

      - name: Run full load suite
        run: |
          failed=0
          for script in tests/load/devices.js tests/load/events.js tests/load/multi-instance.js tests/load/playback.js tests/load/redis-degraded.js tests/load/uploads.js; do
            echo "=== Running $script ==="
            if ! k6 run --summary-export="k6-$(basename "$script" .js)-summary.json" "$script"; then
              failed=1
            fi
          done
          exit "$failed"
        env:
          BASE_URL: ${{ secrets.LOAD_BASE_URL }}

      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: k6-full-summaries
          path: k6-*-summary.json
          retention-days: 30
