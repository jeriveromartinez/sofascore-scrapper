name: Deploy

on:
  workflow_run:
    workflows:
      - CI
      - Integration
      - E2E
      - "Load Tests"
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify preconditions
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit precondition
        run: |
          echo "Deploy authorized for ref: ${{ steps.ref.outputs.sha }}"
          echo "Trigger: ${{ github.event_name }}"

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.CONTAINER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:${{ needs.verify.outputs.sha }}
            ${{ secrets.CONTAINER_REGISTRY }}/${{ secrets.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy notification
        run: |
          echo "Deployed ${{ secrets.IMAGE_NAME }}:${{ needs.verify.outputs.sha }}"
          echo "Registry: ${{ secrets.CONTAINER_REGISTRY }}"
