name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify deployment eligibility
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}

    steps:
      - name: Select validated revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "Manual production deployments must run from main" >&2
              exit 1
            }
            sha="$GITHUB_SHA"
          else
            sha="$WORKFLOW_RUN_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid deployment SHA: $sha" >&2
            exit 1
          }

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            runs=$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=100")
            jq -e --arg sha "$sha" '
              any(.workflow_runs[];
                .head_sha == $sha and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success"
              )
            ' <<<"$runs" >/dev/null || {
              echo "No successful completed CI push run found for main SHA $sha" >&2
              exit 1
            }
          fi

          main_ref=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main")
          jq -e --arg sha "$sha" '
            .object.type == "commit" and .object.sha == $sha
          ' <<<"$main_ref" >/dev/null || {
            echo "Refusing stale deployment: selected SHA $sha is not current main" >&2
            exit 1
          }

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying validated revision $sha"

  deploy:
    name: Deploy to production
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.sha != ''
    runs-on: [self-hosted, iptv]
    environment:
      name: production
    timeout-minutes: 30

    steps:
      - name: Install base dependencies
        shell: bash
        run: |
          source /etc/os-release
          [[ "$ID" == "ubuntu" ]] || {
            echo "The production runner must use Ubuntu" >&2
            exit 1
          }
          missing=()
          for package in ca-certificates curl git python3; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then
              missing+=("$package")
            fi
          done
          if ((${#missing[@]})); then
            echo "Missing packages: ${missing[*]}" >&2
            echo "Run these commands on the production server:" >&2
            echo "  sudo apt-get update" >&2
            echo "  sudo apt-get install -y ${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          clean: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify production prerequisites
        id: runtime
        shell: bash
        run: |
          [[ "$(uname -s)" == "Linux" ]]
          [[ "$(id -un)" == "iptv" ]] || {
            echo "The production runner must run as iptv" >&2
            exit 1
          }
          runtime_dir="/run/user/$(id -u)"
          [[ -S "$runtime_dir/bus" ]] || {
            echo "systemd user bus is unavailable: $runtime_dir/bus" >&2
            exit 1
          }
          export XDG_RUNTIME_DIR="$runtime_dir"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          for command in curl git go node npm python3 systemctl; do
            command -v "$command" >/dev/null || {
              echo "Missing required command: $command" >&2
              exit 1
            }
          done
          systemctl --user show iptv.service --property=LoadState --value | grep -qx loaded
          [[ -d /opt/iptv && -w /opt/iptv ]]
          for storage in /opt/iptv/apk_storage /opt/iptv/image_storage; do
            [[ -d "$storage" && -w "$storage" ]] || {
              echo "Storage is not writable: $storage" >&2
              exit 1
            }
          done
          environment_file=/etc/iptv/iptv.env
          [[ -r "$environment_file" ]] || {
            echo "Service environment file is not readable: $environment_file" >&2
            exit 1
          }
          if ! grep -Eq '^JWT_SECRET=.+$' "$environment_file"; then
            echo "JWT_SECRET is missing from $environment_file" >&2
            echo "Run this command on the production server:" >&2
            echo '  python3 -c '\''import secrets; print("JWT_SECRET=" + secrets.token_hex(32))'\'' | sudo tee -a /etc/iptv/iptv.env >/dev/null' >&2
            exit 1
          fi
          api_addr=$(grep -E '^API_ADDR=' "$environment_file" | tail -n 1 | cut -d= -f2-)
          health_port=${api_addr##*:}
          [[ "$health_port" =~ ^[0-9]+$ ]] || {
            echo "API_ADDR must end in a numeric port in $environment_file; got: $api_addr" >&2
            exit 1
          }
          echo "health_url=http://127.0.0.1:${health_port}/health/ready" >> "$GITHUB_OUTPUT"

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build native server
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o build/iptv ./cmd/server

      - name: Publish and verify
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.sha }}
          HEALTH_URL: ${{ steps.runtime.outputs.health_url }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || {
            echo "Checked out revision does not match selected SHA $EXPECTED_SHA" >&2
            exit 1
          }
          remote_main=$(git ls-remote --exit-code origin refs/heads/main)
          remote_main_sha=${remote_main%%[[:space:]]*}
          [[ "$remote_main_sha" == "$EXPECTED_SHA" ]] || {
            echo "Refusing stale deployment: selected SHA $EXPECTED_SHA is not current main $remote_main_sha" >&2
            exit 1
          }
          deployments/native/deploy.sh build/iptv web/dist "$EXPECTED_SHA"

      - name: Service diagnostics
        if: failure()
        run: |
          systemctl --user status iptv.service --no-pager || true
          journalctl --user -u iptv.service -n 100 --no-pager || true
