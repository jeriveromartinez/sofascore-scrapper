syntax = "proto3";

package sofascore;

option go_package = "github.com/jeriveromartinez/sofascore-scrapper/internal/gen/api;api";

// ========== Common ==========

message ErrorResponse {
  string error = 1;
}

message StatusMessage {
  string message = 1;
}

message StatusResponse {
  string status = 1;
}

// ========== Auth / Users ==========

message AuthRequest {
  string email = 1;
  string password = 2;
  string invitation_token = 3;
}

message CreateInvitationRequest {
  int64 ttl_seconds = 1;
}

message InvitationResponse {
  string token = 1;
  int64 expires_at = 2;
}

message AuthResponse {
  uint32 id = 1;
  string email = 2;
  string token = 3;
  string refresh_token = 4;
}

message User {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string email = 4;
  string role = 5;
  // Push notifications per-user feature toggle (added 2026-08-28).
  // When false, the user cannot send pushes; the web dashboard hides the
  // push section and REST endpoints return 403.
  bool notifications_enabled = 6;
  // RFC3339 timestamp of when notifications_enabled was last flipped to true;
  // empty string if the feature was never activated. Auditing only.
  string notifications_enabled_at = 7;
}

// SetNotificationsEnabledRequest flips the per-user push feature
// toggle. The response is the updated User (echoed back so the
// dashboard can refresh without a second GET).
message SetNotificationsEnabledRequest {
  bool enabled = 1;
}

message UserList {
  repeated User users = 1;
}

message UserWriteRequest {
  string email = 1;
  string password = 2;
}

message SetUserRoleRequest {
  string role = 1;
}

message CursorPageInfo {
  string next_cursor = 1;
  bool has_more = 2;
}

message UserPage {
  repeated User data = 1;
  CursorPageInfo page = 2;
}

// ========== Domains ==========

message Domain {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string domain = 4;
  uint32 user_id = 5;
  User user = 6;
}

message DomainList {
  repeated Domain domains = 1;
}

message DomainPage {
  repeated Domain data = 1;
  CursorPageInfo page = 2;
}

message DomainRequest {
  string domain = 1;
  uint32 user_id = 2;
}

// ========== Devices ==========

message DeviceRegisterRequest {
  string token = 1;
  string platform = 2;
  string name = 3;
  string version = 4;
  // Optional domain assignment (added 2026-08-28). When non-zero, the
  // backend sets devices.domain_id to this value (validating that the
  // domain exists; per-user ownership is not enforced at register time
  // because the Flutter app does not authenticate as a user).
  uint32 domain_id = 5;
  string package_id = 6;
  // IANA timezone string (e.g. "America/Mexico_City"). Empty means the
  // device did not register a TZ; the scheduler treats it as UTC when
  // computing per-device fire times for device-local scheduled pushes.
  string timezone = 7;
}

message Device {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string token = 4;
  string platform = 5;
  string name = 6;
  int64 last_seen = 7;
  string version = 8;
  string iptv_url = 9;
  uint32 domain_id = 10;
  string package_id = 11;
  // IANA timezone string persisted from DeviceRegisterRequest.timezone.
  // Empty means "not registered"; the scheduler falls back to UTC.
  string timezone = 12;
}

message DeviceList {
  repeated Device data = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
  int32 total_pages = 5;
}

message DevicePage {
  repeated Device data = 1;
  CursorPageInfo page = 2;
}

message DeviceUrl {
  string url = 1;
}

// ========== Tournaments ==========

message TournamentRequest {
  string name = 1;
  string slug = 2;
}

message Tournament {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  string name = 4;
  string slug = 5;
  string region = 6;
}

message TournamentList {
  repeated Tournament tournaments = 1;
}

message TournamentPage {
  repeated Tournament data = 1;
  CursorPageInfo page = 2;
}

// ========== Device Tournaments ==========

message AssignTournamentRequest {
  uint32 device_id = 1;
  uint32 tournament_id = 2;
}

message SetTournamentIdsRequest {
  repeated uint32 tournament_ids = 1;
}

message DeviceTournament {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  uint32 device_id = 4;
  uint32 tournament_id = 5;
  Device device = 6;
  Tournament tournament = 7;
}

message DeviceTournamentList {
  repeated DeviceTournament device_tournaments = 1;
}

message DeviceTournamentPage {
  repeated DeviceTournament data = 1;
  CursorPageInfo page = 2;
}

// ========== Global Config ==========

message GlobalTournamentConfig {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  uint32 tournament_id = 4;
  Tournament tournament = 5;
}

message GlobalTournamentConfigList {
  repeated GlobalTournamentConfig configs = 1;
}

// ========== Teams ==========

message Team {
  uint32 id = 1;
  int64 team_id = 2;
  string logo_url = 3;
  string primary_color = 4;
  string secondary_color = 5;
  string text_color = 6;
  string name = 7;
}

// ========== Events ==========

message SofaScoreEvent {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  int64 sofa_score_event_id = 4;
  string sport = 5;
  int32 home_score = 6;
  int64 home_team_id = 7;
  int32 away_score = 8;
  int64 away_team_id = 9;
  int64 scraped_at = 10;
  string category = 11;
  int64 start_timestamp = 12;
  int64 current_period_start_timestamp = 13;
  string slug = 14;
  Team team_home = 15;
  Team team_away = 16;
  Tournament league = 17;
  string status_type = 18;
}

message EventsList {
  repeated SofaScoreEvent data = 1;
  int32 page = 2;
  int32 limit = 3;
  int64 total = 4;
  int32 total_pages = 5;
}

message EventPage {
  repeated SofaScoreEvent data = 1;
  CursorPageInfo page = 2;
}

// ========== Playback ==========

message LogPlaybackRequest {
  string device_token = 1;
  string content = 2;
  int64 started_at = 3;
}

message UpdatePlaybackRequest {
  int64 ended_at = 1;
}

message PlaybackLog {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  uint32 device_id = 4;
  string content = 5;
  int64 started_at = 6;
  int64 ended_at = 7;
}

message PlaybackLogList {
    repeated PlaybackLog list = 1;
    uint32 total = 2;
}

message PlaybackPage {
  repeated PlaybackLog data = 1;
  CursorPageInfo page = 2;
}

// ========== Stats ==========

message EventStats {
  int64 sofa_score_event_id = 1;
  int64 view_count = 2;
}

message TopEventsResponse {
  repeated EventStats stats = 1;
}

// ========== APK ==========

message ApkInfo {
  uint32 id = 1;
  string version = 2;
  string file_name = 3;
  int64 file_size = 4;
  string description = 5;
  string package_name = 6;
  int32 version_code = 7;
  int32 min_sdk_version = 8;
  int32 target_sdk_version = 9;
  string download_token = 10;
  string download_url = 11;
  string created_at = 12;
  bool is_active = 13;
  int32 downloads = 14;
  string panel_url = 15;
}

message ApkList {
  repeated ApkInfo versions = 1;
}

message ApkPage {
  repeated ApkInfo data = 1;
  CursorPageInfo page = 2;
}

message ApkUploadResponse {
  uint32 id = 1;
  string version = 2;
  string file_name = 3;
  int64 file_size = 4;
  string description = 5;
  string package_name = 6;
  int32 version_code = 7;
  int32 min_sdk_version = 8;
  int32 target_sdk_version = 9;
  string download_token = 10;
  string download_url = 11;
  string created_at = 12;
}

message ApkUpdateCheckResponse {
  bool update_available = 1;
  string latest_version = 2;
  string package_name = 3;
  int32 version_code = 4;
  string download_url = 5;
  string description = 6;
  int64 file_size = 7;
  int32 min_sdk_version = 8;
  int32 target_sdk_version = 9;
}

message ApkVersion {
    uint32 id = 1;
    string url = 2;
}

// ========== APK Resumable Upload ==========

message UploadBeginRequest {
  string file_name = 1;
  int64 file_size = 2;
  int32 total_chunks = 3;
  string version = 4;
  string description = 5;
}

message UploadBeginResponse {
  string upload_id = 1;
  int32 max_chunk_size = 2;
  int32 max_total_chunks = 3;
  int64 max_aggregate_size = 4;
  int32 expires_at = 5;
  string status = 6;
  int32 chunks_received = 7;
  int64 bytes_received = 8;
}

message UploadStatusResponse {
  string upload_id = 1;
  string status = 2;
  int32 total_chunks = 3;
  int32 chunks_received = 4;
  int64 bytes_received = 5;
  int32 expires_at = 6;
  string file_name = 7;
  int64 file_size = 8;
}

message UploadChunkResponse {
  string upload_id = 1;
  int32 chunk_index = 2;
  bool ok = 3;
}

message UploadCompleteResponse {
  uint32 id = 1;
  string version = 2;
  string file_name = 3;
  int64 file_size = 4;
  string description = 5;
  string package_name = 6;
  int32 version_code = 7;
  int32 min_sdk_version = 8;
  int32 target_sdk_version = 9;
  string download_token = 10;
  string download_url = 11;
  string created_at = 12;
}

// ========== Push Notifications (added 2026-08-28) ==========
//
// Wire format reference: docs/superpowers/specs/2026-08-28-push-notifications-websocket-design.md

// PushCategory is the type of event a push message represents. The
// category drives how the Flutter client renders the notification and
// which user-visible icon/chime to use.
enum PushCategory {
  PUSH_CATEGORY_UNSPECIFIED = 0;
  PUSH_CATEGORY_EVENT_ALERT = 1;     // live score change, match start, etc.
  PUSH_CATEGORY_APK_UPDATE = 2;      // new app version available
  PUSH_CATEGORY_ADMIN_MESSAGE = 3;   // free-form message from the operator
  PUSH_CATEGORY_SCHEDULED = 4;       // delivered from a scheduled_push
}

// PushPriority hints the client how to render the notification. HIGH may
// bypass Do Not Disturb on capable devices.
enum PushPriority {
  PUSH_PRIORITY_UNSPECIFIED = 0;
  PUSH_PRIORITY_NORMAL = 1;
  PUSH_PRIORITY_HIGH = 2;
}

// PushScheduleType discriminates between a one_shot timestamp and a
// recurring cron expression in ScheduledPush.
enum PushScheduleType {
  PUSH_SCHEDULE_TYPE_UNSPECIFIED = 0;
  PUSH_SCHEDULE_TYPE_ONE_SHOT = 1;
  PUSH_SCHEDULE_TYPE_RECURRING = 2;
}

// DeliveryState is the lifecycle of a single (push, device) attempt.
enum DeliveryState {
  DELIVERY_STATE_UNSPECIFIED = 0;
  DELIVERY_STATE_SENT = 1;           // WriteMessage OK, waiting for ack
  DELIVERY_STATE_DELIVERED = 2;      // client acked
  DELIVERY_STATE_FAILED = 3;         // timeout, disconnect, or error
}

// DeliveryFailureReason explains why a delivery attempt did not succeed.
// Populated only when state == DELIVERY_STATE_FAILED.
enum DeliveryFailureReason {
  DELIVERY_FAILURE_REASON_UNSPECIFIED = 0;
  DELIVERY_FAILURE_REASON_DEVICE_OFFLINE = 1;     // no live WS connection
  DELIVERY_FAILURE_REASON_SEND_TIMEOUT = 2;       // ack not received in N seconds
  DELIVERY_FAILURE_REASON_WS_DISCONNECTED = 3;    // socket died mid-write
  DELIVERY_FAILURE_REASON_DOMAIN_MISMATCH = 4;    // device.domain_id != push audience
  DELIVERY_FAILURE_REASON_EXPIRED_TOKEN = 5;      // device token revoked
  DELIVERY_FAILURE_REASON_INTERNAL_ERROR = 6;
}

// PushPayload is the user-authored content carried by both immediate and
// scheduled pushes. All fields are stored denormalized on push_messages
// (and scheduled_pushes) so we never need to join at delivery time.
message PushPayload {
  PushCategory category = 1;
  string title = 2;
  string body = 3;
  string image_url = 4;
  string deep_link = 5;
  PushPriority priority = 6;
  int32 ttl_seconds = 7;                       // 0 = no TTL
  map<string, string> data = 8;                // free-form metadata
}

message CreateImmediatePushRequest {
  repeated uint32 domain_ids = 1;              // one or many, all must belong to caller
  PushPayload payload = 2;
}

message CreateScheduleRequest {
  repeated uint32 domain_ids = 1;
  PushPayload payload = 2;
  PushScheduleType schedule_type = 3;
  string run_at = 4;                           // RFC3339; required when schedule_type == ONE_SHOT
  string cron_expr = 5;                        // 5-field cron; required when schedule_type == RECURRING
}

// UpdateScheduleRequest intentionally omits cron_expr and run_at. Those
// fields are immutable after create; if the operator needs to change the
// schedule, the existing schedule is deleted and a new one is created.
// This avoids races with the scheduler runner that already calculated
// next_fire_at from the old expression.
message UpdateScheduleRequest {
  uint32 id = 1;
  bool is_active = 2;
  PushPayload payload = 3;
}

message ScheduledPush {
  uint32 id = 1;
  string created_at = 2;
  string updated_at = 3;
  uint32 user_id = 4;
  PushScheduleType schedule_type = 5;
  string run_at = 6;                           // populated for one_shot
  string cron_expr = 7;                        // populated for recurring
  string next_fire_at = 8;
  string last_fired_at = 9;                    // empty if never fired
  bool is_active = 10;
  repeated uint32 domain_ids = 11;
  PushPayload payload = 12;
}

message ScheduledPushPage {
  repeated ScheduledPush data = 1;
  CursorPageInfo page = 2;
}

message PushMessage {
  uint32 id = 1;
  string created_at = 2;
  uint32 user_id = 3;
  PushCategory category = 4;
  string title = 5;
  string body = 6;
  string image_url = 7;
  string deep_link = 8;
  PushPriority priority = 9;
  int32 ttl_seconds = 10;
  map<string, string> data = 11;
  string source = 12;                          // "immediate" | "scheduled"
  uint32 scheduled_id = 13;                    // 0 when source == "immediate"
  repeated uint32 domain_ids = 14;
}

message PushMessagePage {
  repeated PushMessage data = 1;
  CursorPageInfo page = 2;
}

// Per-campaign metrics returned by GET /pushes/{id}.
message FailureBreakdown {
  DeliveryFailureReason reason = 1;
  int64 count = 2;
}

message PushMetricsByCampaign {
  uint32 push_id = 1;
  int64 targets_total = 2;
  int64 delivered = 3;
  int64 not_delivered = 4;
  double delivery_rate = 5;                    // delivered / targets_total
  int64 latency_p50_ms = 6;
  int64 latency_p95_ms = 7;
  repeated FailureBreakdown failures_by_reason = 8;
}

// Aggregated metrics returned by GET /pushes/metrics/aggregate.
message PlatformCount   { string platform = 1; int64 count = 2; }
message AppVersionCount { string version = 1; int64 count = 2; }
message HourBucket      { int32 hour = 1; int64 count = 2; }

message PushMetricsAggregate {
  int64 messages_sent_total = 1;
  int64 messages_delivered_total = 2;
  double delivery_rate_total = 3;
  int64 active_schedules = 4;
  int64 scheduled_fires_24h = 5;
  int64 scheduled_fires_7d = 6;
  int64 scheduled_fires_30d = 7;
  int64 scheduled_failures_24h = 8;
  int64 scheduled_failures_7d = 9;
  int64 scheduled_failures_30d = 10;
  int64 audience_size = 11;                    // devices currently connected via WS
  int64 audience_peak_today = 12;
  repeated PlatformCount top_platforms = 13;
  repeated AppVersionCount top_app_versions = 14;
  repeated HourBucket hourly_histogram_30d = 15;
  string last_push_at = 16;                    // RFC3339; empty if never
}

// ========== Build info (added 2026-08-30) ==========

message BuildInfo {
  // Última etiqueta semver del build (ej: "v0.0.4"). Default "dev" si se compiló sin -ldflags.
  string version = 1;
  // SHA corto del commit con el que se compiló el binario (ej: "a0db9ad"). Default "unknown".
  string commit = 2;
}

// ========== WebSocket frames (added 2026-08-28) ==========
//
// WsFrame is the single envelope used on the WebSocket connection. Every
// frame is a proto-encoded WsFrame; the receiver dispatches based on
// which oneof case is set. This keeps the wire format uniform and lets
// the client/server stay forward-compatible with new frame types.
message WsFrame {
  oneof payload {
    WsHello   hello    = 1;   // server -> client on connect
    WsPush    push     = 2;   // server -> client: a push delivery
    WsPushAck push_ack = 3;   // client -> server: confirms a push
    WsPing    ping     = 4;   // bidirectional keepalive
    WsPong    pong     = 5;
    WsError   error    = 6;   // server -> client: terminal error before close
  }
}

message WsHello {
  uint64 device_id = 1;
  int64 server_time = 2;                       // unix seconds
}

message WsPush {
  uint64 push_id = 1;                          // = push_messages.id
  string message_id = 2;                       // unique per attempt; client must echo in ack
  PushCategory category = 3;
  string title = 4;
  string body = 5;
  string image_url = 6;
  string deep_link = 7;
  PushPriority priority = 8;
  int32 ttl_seconds = 9;
  map<string, string> data = 10;
  int64 sent_at = 11;                          // unix milliseconds; client uses for latency
}

message WsPushAck {
  string message_id = 2;                       // echoes WsPush.message_id (kept for client-side latency display)
  int64 acked_at = 3;                          // unix milliseconds
}

message WsPing { int64 sent_at = 1; }          // unix milliseconds
message WsPong { int64 sent_at = 1; }

message WsError {
  string code = 1;                             // invalid_token | domain_mismatch | rate_limited | internal
  string message = 2;
}
