# Local test stack: one backend, tmpfs MariaDB + Redis so each run starts
# clean. A `bootstrap-invitation` one-shot seeds an invite token into a
# shared volume for tests that need to register the first admin.
#
# The backend image is built from deployments/docker/Dockerfile.e2e.
#
# Usage:
#   docker compose -f deployments/docker/compose.test.yml up --build --abort-on-container-exit
#
# E2E_BACKEND_PORT overrides the host port of the backend, for a machine
# where 8080 is already taken. The suite then has to be pointed at it
# with E2E_BASE_URL.

# The project name is pinned so that every invocation of this file
# addresses the same containers, whatever directory the command runs
# from. The suite pauses the redis container through compose, and that
# only finds it when both commands agree on the project.
name: e2e

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: scores365
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # mariadb-admin ping also answers the socket-only temporary server
      # the entrypoint runs during first init, before TCP 3306 is open.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - test-net

  redis:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks:
      - test-net

  bootstrap-invitation:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.e2e
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BOOTSTRAP_ONLY: "true"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test
      DB_NAME: scores365
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: test-jwt-secret-for-e2e-stack-0123456789abcd
      APK_STORAGE_PATH: /tmp/apk_storage
      IMAGE_STORAGE_PATH: /tmp/image_storage
    volumes:
      - invite-data:/shared
    networks:
      - test-net

  backend:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.e2e
    ports:
      - "${E2E_BACKEND_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap-invitation:
        condition: service_completed_successfully
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test
      DB_NAME: scores365
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: test-jwt-secret-for-e2e-stack-0123456789abcd
      API_ADDR: "0.0.0.0:8080"
      APK_STORAGE_PATH: /tmp/apk_storage
      IMAGE_STORAGE_PATH: /tmp/image_storage
      # The first boot seeds this administrator (internal/seeder); without a
      # fixed password the account would get a random one and the e2e suite
      # could not log in.
      DEFAULT_ADMIN_PASSWORD: E2eStackAdminPass1!
      # The suite runs from the host, so every request of it arrives from
      # the gateway of the docker network and the throttle of the auth
      # endpoints counts all the runs of the suite as a single client.
      # Trusting the proxy lets the suite send the address of the client
      # it acts for, the way a deployment behind a reverse proxy does.
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    tmpfs:
      - /tmp/apk_storage
      - /tmp/image_storage
    volumes:
      - invite-data:/shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - test-net

volumes:
  invite-data:

networks:
  test-net:
