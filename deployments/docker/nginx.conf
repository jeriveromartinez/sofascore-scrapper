upstream backends {
    least_conn;
    server backend-1:8080 max_fails=3 fail_timeout=15s;
    server backend-2:8080 max_fails=3 fail_timeout=15s;
    server backend-3:8080 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://backends;
    }

    location = /metrics {
        deny all;
    }

    location = /api/web/v1/apk/upload {
        client_max_body_size 201m;
        proxy_pass http://backends;
    }

    location = /api/web/v1/apk/upload/chunk {
        client_max_body_size 11m;
        proxy_pass http://backends;
    }

    location ~ ^/api/web/v1/apk/uploads/[^/]+/chunks/[0-9]+$ {
        client_max_body_size 11m;
        proxy_pass http://backends;
    }

    location /health/live {
        proxy_pass http://backends;
    }
}
