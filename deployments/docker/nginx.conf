upstream backends {
    least_conn;
    server backend-1:8080 max_fails=3 fail_timeout=15s;
    server backend-2:8080 max_fails=3 fail_timeout=15s;
    server backend-3:8080 max_fails=3 fail_timeout=15s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The realtime route accepts the device token as ?token=, so the access
# log records $uri (no query string) instead of the full $request.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log redacted;

    client_max_body_size 1m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://backends;
    }

    # The server pings every 30s (internal/realtime/handler.go), so a
    # healthy socket is never idle this long; the timeouts only reap
    # dead peers.
    location = /api/app/v1/ws {
        proxy_pass http://backends;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /metrics {
        deny all;
    }

    location = /api/web/v1/apk/upload {
        client_max_body_size 201m;
        proxy_pass http://backends;
    }

    location = /api/web/v1/apk/upload/chunk {
        client_max_body_size 11m;
        proxy_pass http://backends;
    }

    location ~ ^/api/web/v1/apk/uploads/[^/]+/chunks/[0-9]+$ {
        client_max_body_size 11m;
        proxy_pass http://backends;
    }

    location /health/live {
        proxy_pass http://backends;
    }
}
