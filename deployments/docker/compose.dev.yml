services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-dev}
      MARIADB_DATABASE: ${DB_NAME:-sofascore}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - dev-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dev-net

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-dev}
      DB_NAME: ${DB_NAME:-sofascore}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      API_ADDR: "0.0.0.0:8080"
      APK_STORAGE_PATH: /data/apk
      IMAGE_STORAGE_PATH: /data/image
    volumes:
      - apk_data:/data/apk
      - image_data:/data/image
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - dev-net

volumes:
  mariadb_data:
  redis_data:
  apk_data:
  image_data:

networks:
  dev-net:
