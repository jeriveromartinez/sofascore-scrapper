groups:
  - name: scores365-app
    interval: 30s
    rules:
      # No blackbox_exporter is deployed, so the backend's own /metrics
      # scrape is the liveness signal: `up` drops to 0 when the process
      # is down or unreachable. The job name must match
      # deployments/docker/prometheus.yml.
      - alert: scores365_health_probe_failure
        expr: up{job="scores365-backends"} == 0
        for: 2m
        labels:
          severity: critical
          service: scores365-scrapper
        annotations:
          summary: "Backend {{ $labels.instance }} unreachable"
          description: |
            Prometheus has failed to scrape /metrics on
            {{ $labels.instance }} for 2 minutes: the process is down,
            crash-looping or unreachable from Prometheus. See
            docs/operations/runbook.md,
            "Alert: scores365_health_probe_failure".

      # One sample per league and day scraped, labelled status="ok" or
      # status="error" by internal/scraper/service.go.
      - alert: scores365_scrape_failure_rate
        expr: |
          (
            sum(rate(scrape_requests_total{status="error"}[5m]))
            /
            sum(rate(scrape_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: scores365-scrapper
        annotations:
          summary: "365scores scrape error rate above 5% for 5 minutes"
          description: |
            The scraper's error rate is
            {{ $value | humanizePercentage }} over the last 5 minutes.
            See docs/operations/runbook.md,
            "Alert: scores365_scrape_failure_rate".

      # Goroutine leak: go_goroutines is published by the default
      # Go collector. A steadily increasing trend without a return to
      # baseline indicates a leak.
      - alert: scores365_goroutine_leak_high
        expr: |
          deriv(go_goroutines[10m]) > 5
          and
          go_goroutines > 200
        for: 15m
        labels:
          severity: warning
          service: scores365-scrapper
        annotations:
          summary: "Goroutine count trending up for 15 minutes"
          description: |
            The Go process on {{ $labels.instance }} is gaining more than
            5 goroutines per 10 minutes and is now above 200 in total.
            See docs/operations/runbook.md,
            "Alert: scores365_goroutine_leak_high".

      # Connection pool exhaustion: sql_in_use_connections equals
      # sql_open_connections and the application is also waiting for
      # more connections, which means new queries are blocking.
      - alert: scores365_db_connection_pool_exhausted
        expr: |
          sql_in_use_connections >= sql_open_connections
          and
          sql_open_connections > 0
          and
          increase(sql_wait_count_total[2m]) > 0
        for: 2m
        labels:
          severity: critical
          service: scores365-scrapper
        annotations:
          summary: "DB connection pool exhausted on {{ $labels.instance }}"
          description: |
            All SQL connections are in use and at least one waiter has
            accumulated in the last 2 minutes. The DB is the bottleneck
            or a long-running query is blocking the pool. See
            docs/operations/runbook.md,
            "Alert: scores365_db_connection_pool_exhausted".
